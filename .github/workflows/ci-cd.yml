name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Tag imutável para rollback em produção (deixe vazio para release normal)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run lint
        run: poetry run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lacrei_saude
          POSTGRES_USER: lacrei
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lacrei -d lacrei_saude"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DEBUG: "False"
      USE_SQLITE: "False"
      POSTGRES_DB: lacrei_saude
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: ci-test-secret-key
      API_KEY: ci-test-api-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run tests with coverage
        run: |
          poetry run coverage run manage.py test
          poetry run coverage report
          poetry run coverage xml
      - name: Publish coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: staging
    steps:
      - name: Deploy image to staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          HEALTH_URL: ${{ secrets.STAGING_URL }}/health/
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE,DEPLOY_PATH,HEALTH_URL,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            export IMAGE_REPOSITORY="${IMAGE%:*}" IMAGE_TAG="${IMAGE##*:}"
            docker compose pull web
            docker compose up -d --no-build web
            curl --fail --retry 12 --retry-delay 5 "$HEALTH_URL"
      - name: Record staging health check
        run: |
          echo "Staging URL: ${{ secrets.STAGING_URL }}" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --retry 3 "${{ secrets.STAGING_URL }}/health/" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Deploy image to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          HEALTH_URL: ${{ secrets.PRODUCTION_URL }}/health/
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: IMAGE,DEPLOY_PATH,HEALTH_URL,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            export IMAGE_REPOSITORY="${IMAGE%:*}" IMAGE_TAG="${IMAGE##*:}"
            docker compose pull web
            docker compose up -d --no-build web
            curl --fail --retry 12 --retry-delay 5 "$HEALTH_URL"
      - name: Record production health check
        run: |
          echo "Production URL: ${{ secrets.PRODUCTION_URL }}" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --retry 3 "${{ secrets.PRODUCTION_URL }}/health/" >> "$GITHUB_STEP_SUMMARY"

  rollback-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_tag != ''
    environment: production
    steps:
      - name: Roll back production to immutable image
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]'):${{ inputs.rollback_tag }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          HEALTH_URL: ${{ secrets.PRODUCTION_URL }}/health/
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: IMAGE,DEPLOY_PATH,HEALTH_URL,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            export IMAGE_REPOSITORY="${IMAGE%:*}" IMAGE_TAG="${IMAGE##*:}"
            docker compose pull web
            docker compose up -d --no-build web
            curl --fail --retry 12 --retry-delay 5 "$HEALTH_URL"
      - name: Record rollback evidence
        run: |
          echo "Rollback tag: ${{ inputs.rollback_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production URL: ${{ secrets.PRODUCTION_URL }}" >> "$GITHUB_STEP_SUMMARY"
