services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lacrei_saude}
      POSTGRES_USER: ${POSTGRES_USER:-lacrei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lacrei123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lacrei} -d ${POSTGRES_DB:-lacrei_saude}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: ${IMAGE_REPOSITORY:-lacrei-saude}:${IMAGE_TAG:-local}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: ${DEBUG:-True}
      USE_SQLITE: ${USE_SQLITE:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      API_KEY: ${API_KEY:-lacrei-dev-key}
      POSTGRES_DB: ${POSTGRES_DB:-lacrei_saude}
      POSTGRES_USER: ${POSTGRES_USER:-lacrei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lacrei123}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles

volumes:
  postgres_data:
